name: Build macOS App

# Déclenchement :
#   - push d'un tag "vX.Y.Z"  -> build + création d'une GitHub Release avec le zip attaché
#   - déclenchement manuel (bouton "Run workflow" dans l'onglet Actions) -> build + artifact
#     téléchargeable (90 jours), pratique pour tester sans créer de tag/release.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  build:
    # Runner macOS hébergé par GitHub, Apple Silicon natif (arm64).
    runs-on: macos-14

    # Nécessaire pour que softprops/action-gh-release puisse créer la
    # Release (le GITHUB_TOKEN par défaut est en lecture seule sinon).
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancer les tests (hors hosting AU réel, macOS-only mais non couvert par ces tests)
        run: python3 -m pytest tests/ -q

      - name: Build de l'app (py2app)
        run: |
          rm -rf build dist
          python3 setup.py py2app --quiet

      - name: Signature ad-hoc (requis pour lancer un binaire arm64 non notarié)
        run: codesign --force --deep --sign - "dist/Refinr.app"

      - name: Déterminer la version
        id: version
        run: |
          VERSION=$(python3 -c "from refinr import __version__; print(__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Zipper l'app
        run: |
          cd dist
          zip -r -q "../Refinr_v${{ steps.version.outputs.version }}.zip" "Refinr.app"

      - name: Upload de l'artifact de build
        uses: actions/upload-artifact@v7
        with:
          name: Refinr-v${{ steps.version.outputs.version }}
          path: Refinr_v${{ steps.version.outputs.version }}.zip
          retention-days: 90

      - name: Créer une GitHub Release (uniquement si déclenché par un tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: Refinr_v${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
